name: CI/CD Pipeline - RaceDay API

on:
  push:
    branches: [ main, master, part2 ]
  pull_request:
    branches: [ main, master, part2 ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    
    - name: Restore dependencies
      run: dotnet restore src/RaceDay.API/RaceDay.API.slnx
    
    - name: Build
      run: dotnet build src/RaceDay.API/RaceDay.API.slnx --no-restore --configuration Release
    
    - name: Test
      run: dotnet test src/RaceDay.API/RaceDay.API.slnx --no-build --configuration Release --verbosity normal
